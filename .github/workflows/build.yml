# C-30（2026-10-24）：全平台打包矩阵 CI（报告 C-30 第 5 步）。
# 触发：推 v* tag 或手动 workflow_dispatch；三平台矩阵各出双架构安装包（D-01：无 ia32）。
# 签名公证：CSC_LINK / CSC_KEY_PASSWORD（win/mac 代码签名）与 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID（mac 公证）经 secrets 注入；机密为空时 electron-builder 跳过签名与公证（仅警告不失败），
# CSC_IDENTITY_AUTO_DISCOVERY=false 免去本机钥匙串身份探测（不影响将来 CSC_LINK 证书生效）。
# 测试步骤不阻塞出包：Linux 已知基线含 23+ 失败（报告 §1.3 / 附录 C），结果仍随 latest.json 上传供查验。
# 本地优先纪律：electron-builder 一律 --publish never，CI 只产包不发布；发布 = 人工推 tag 后手动上传 Release。
name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux：Electron 运行时系统库（测试套件的 electron 运行时需要）+ xvfb；
      # postinstall 的 ABI 验证走 ELECTRON_RUN_AS_NODE，无需图形栈。
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libgbm1 libasound2t64 xvfb

      - name: npm ci
        run: npm ci

      # U-06：npm 只装宿主架构的可选依赖（napi-rs 系按平台分包：fsrs-rs-nodejs 与
      # pdfjs-dist 的可选 @napi-rs/canvas），跨架构出包需显式补目标架构包；
      # better-sqlite3 v13 的 prebuilds/ 已内置全平台无需处理。
      - name: Install cross-arch native optional deps
        shell: bash
        run: |
          VER=$(node -p "require('./node_modules/fsrs-rs-nodejs/package.json').version")
          CVER=$(node -p "require('./node_modules/@napi-rs/canvas/package.json').version")
          # --force：@napi-rs/canvas 的平台分包声明了 os/cpu 限制，宿主架构不符时 npm 会拒装
          # （EBADPLATFORM）；这里就是要装「非宿主」平台包，必须跳过该校验（仅作用于这两个显式包）。
          case "${{ runner.os }}" in
            Windows) npm install --no-save --force "fsrs-rs-nodejs-win32-arm64-msvc@$VER" "@napi-rs/canvas-win32-arm64-msvc@$CVER" ;;
            macOS)   npm install --no-save --force "fsrs-rs-nodejs-darwin-x64@$VER"     "@napi-rs/canvas-darwin-x64@$CVER" ;;
            Linux)   npm install --no-save --force "fsrs-rs-nodejs-linux-arm64-gnu@$VER" "@napi-rs/canvas-linux-arm64-gnu@$CVER" ;;
            *)       echo "unknown os"; exit 1 ;;
          esac

      - name: Run tests (non-blocking; results uploaded below)
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a node scripts/run-tests.mjs
          else
            node scripts/run-tests.mjs
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/.results/latest.json
          if-no-files-found: ignore

      - name: Build renderer
        run: npm run build

      - name: Package (electron-builder, unsigned path without secrets)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          case "${{ runner.os }}" in
            Windows) npx electron-builder --win --publish never ;;
            macOS)   npx electron-builder --mac --publish never ;;
            Linux)   npx electron-builder --linux --publish never ;;
            *)       echo "unknown os"; exit 1 ;;
          esac

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
