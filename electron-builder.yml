# electron-builder 打包配置（§9.4 技术债「electron-builder 打包」P0 落地）
# 约束（v49.6 / D180 修订）：本地优先 —— 依旧零遥测、CLI 一律 --publish never（不自动上传）；
# publish 仅作为 electron-updater 的更新源声明（打包时生成资源内 app-update.yml），
# owner/repo 为占位符：发布前必须填入真实 GitHub slug（见 §9.5 v49.6 待办）。
appId: com.incrementalreading.desktop
# productName 保持与 package.json name 一致：Electron 的 userData 目录默认取 app 名，
# 改成别的显示名会把数据目录从 %APPDATA%/incremental-reading-dev 迁走（违背 §2 记载的数据路径，重启丢数据观感）。
# 对外显示名由 nsis.shortcutName（桌面/开始菜单快捷方式）承担。
productName: incremental-reading-dev
# D180：更新源 = GitHub Releases。版本号唯一真源 = package.json version（两渠道同步 bump）；
# Microsoft Store 渠道不走此配置（运行时 process.windowsStore 分流，electron/updater.js 禁用自更新）。
publish:
  provider: github
  owner: YOUR_GITHUB_USERNAME
  repo: incremental-reading
directories:
  # vite 的 renderer 产物占用 dist/（D6：dist 存在则优先加载），打包产物必须另立目录，禁止混用。
  output: release
  buildResources: build # electron-builder 惯例目录，仓库已有 build/icon.ico（多尺寸 256px）
files:
  # 精确清单：renderer 产物（含 public 拷贝的 pdfjs/favicon）+ 主进程 + vendor 阅读内核快照。
  # package.json 由 electron-builder 自动打入（剥离 devDependencies）。
  # 生产 node_modules 由 electron-builder 按 dependencies 自动收集，不在此列。
  - dist/**/*
  - electron/**/*
  - vendor/**/*
asar: true
asarUnpack:
  # fsrs-rs-nodejs（NAPI 预编译）等原生绑定不能从 asar 内 dlopen
  - "**/*.node"
  # main.js 以原生路径读取窗口图标（electron/main.js），asar 内原生读文件不可靠
  - electron/icon.ico
  # v49.14（D187）：主题跟随图标（icon-light/dark.png + tray-black/white.ico）运行时原生读取
  - electron/icons/**
# NAPI 预编译（fsrs-rs-nodejs-win32-x64-msvc）与 WASM（sql.js）均无需按 Electron ABI 重编。
# D137（v48.92）：better-sqlite3 是 per-ABI 原生模块，必须按 Electron ABI 就位 → npmRebuild true；
# @electron/rebuild 对 prebuild-install 型模块直接带 electron 运行时参数拉预编译，须带镜像 env
# npm_config_better_sqlite3_binary_host_mirror（见 docs/BETTER-SQLITE3-PACKAGING.md，免网保底路径亦在其中）。
npmRebuild: true
compression: normal
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  # 向导式安装：允许自选安装目录、允许用户决定是否创建快捷方式（已确认决策）
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # 快捷方式显示名用软件定名 Nutation（v49.14 / D187）；exe/安装目录名仍走 ASCII 的 productName，
  # 规避 NSIS 文件名兼容风险；productName 刻意不动＝userData 目录稳定（见上方注释）
  shortcutName: Nutation
  deleteAppDataOnUninstall: false # 卸载不删 userData（本地优先：数据归用户）
  artifactName: ${name}-${version}-setup.${ext}
